openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create an account without OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "409":
          description: Phone number is already registered
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with phone number and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Invalid credentials
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Session ended
  /me:
    get:
      operationId: getMe
      tags: [users]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user's profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
  /users/search:
    get:
      operationId: searchUser
      tags: [users]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: phone
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 20
      responses:
        "200":
          description: Matching user, or null when no account matches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSearchResult"
  /contacts:
    get:
      operationId: getContacts
      tags: [users]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user's contacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contact"
    post:
      operationId: addContact
      tags: [users]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddContactInput"
      responses:
        "201":
          description: Contact added and conversation created or found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
  /contacts/{userId}:
    delete:
      operationId: removeContact
      tags: [users]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Contact removed
  /conversations:
    get:
      operationId: getConversations
      tags: [conversations]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user's private conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
  /conversations/{conversationId}/messages:
    get:
      operationId: getMessages
      tags: [conversations]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: conversationId
          required: true
          schema:
            type: string
        - in: query
          name: after
          required: false
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Messages visible to the current conversation member
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessage"
    post:
      operationId: sendMessage
      tags: [conversations]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: conversationId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Message stored and sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    RegisterInput:
      type: object
      required: [username, phone, password]
      properties:
        username: { type: string, minLength: 2, maxLength: 40 }
        phone: { type: string, minLength: 8, maxLength: 20 }
        password: { type: string, minLength: 8, maxLength: 128 }
    LoginInput:
      type: object
      required: [phone, password]
      properties:
        phone: { type: string, minLength: 8, maxLength: 20 }
        password: { type: string, minLength: 1, maxLength: 128 }
    AddContactInput:
      type: object
      required: [phone]
      properties:
        phone: { type: string, minLength: 8, maxLength: 20 }
    UserProfile:
      type: object
      required: [id, username, phone, createdAt]
      properties:
        id: { type: string }
        username: { type: string }
        phone: { type: string }
        createdAt: { type: string, format: date-time }
    AuthSession:
      type: object
      required: [token, user]
      properties:
        token: { type: string }
        user: { $ref: "#/components/schemas/UserProfile" }
    UserSearchResult:
      type: object
      required: [user, isContact, conversationId]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/UserProfile"
            - type: "null"
        isContact: { type: boolean }
        conversationId: { type: ["string", "null"] }
    Contact:
      type: object
      required: [user, conversationId, addedAt]
      properties:
        user: { $ref: "#/components/schemas/UserProfile" }
        conversationId: { type: string }
        addedAt: { type: string, format: date-time }
    Conversation:
      type: object
      required: [id, peer, createdAt, lastMessage, lastMessageAt]
      properties:
        id: { type: string }
        peer: { $ref: "#/components/schemas/UserProfile" }
        createdAt: { type: string, format: date-time }
        lastMessage: { type: ["string", "null"] }
        lastMessageAt: { type: ["string", "null"], format: date-time }
    ChatMessage:
      type: object
      required: [id, conversationId, senderId, content, createdAt]
      properties:
        id: { type: string }
        conversationId: { type: string }
        senderId: { type: string }
        content: { type: string }
        createdAt: { type: string, format: date-time }
    MessageInput:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 4000 }

